[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healer"
version = "0.1.0"
description = "Self-healer: Selenium wrapper that auto-heals locators using LLM candidates"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Generated by Copilot"}]

dependencies = [
  "selenium>=4.0",
  "python-dotenv>=1.0.0",
  "openai>=1.0.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
self-healer-tests = "self_healer.test_harness:main"
self-healer-api = "self_healer.api.server:main"

[project.urls]
homepage = "https://example.local/self-healer"

[tool.setuptools]
package-dir = {"self_healer" = "."}
packages = [
  "self_healer",
  "self_healer.core",
  "self_healer.api",
  "self_healer.providers",
  "self_healer.selenium_adapter"
]

[tool.tutorial]
# Minimal marker - not used, but helpful for editors
enabled = true
